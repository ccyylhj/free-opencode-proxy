name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: oc-api-proxy-win-x64.exe
            build: build-win.bat
            exe: dist/oc-api-proxy.exe
          - runner: macos-14
            artifact: oc-api-proxy-macos-arm64
            build: ./build-mac.sh
            exe: dist/oc-api-proxy
          - runner: macos-15-intel
            artifact: oc-api-proxy-macos-x64
            build: ./build-mac.sh
            exe: dist/oc-api-proxy
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: bundle + SEA build
        run: ${{ matrix.build }}
        shell: ${{ runner.os == 'Windows' && 'cmd' || 'bash' }}

      - name: ad-hoc sign (macOS only)
        if: runner.os == 'macOS'
        run: codesign --sign - --force dist/oc-api-proxy

      - name: install opencode CLI (best effort, for a stronger smoke test)
        run: npm install -g @opencode/cli
        continue-on-error: true

      - name: boot smoke test (no login needed)
        run: node scripts/ci-smoke.cjs
        env:
          PROXY_BIN: ${{ github.workspace }}/${{ matrix.exe }}
          PROXY_PORT: 6450

      - name: stage artifact (Windows)
        if: runner.os == 'Windows'
        run: copy dist\oc-api-proxy.exe ${{ matrix.artifact }}
        shell: cmd

      - name: stage artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cp dist/oc-api-proxy ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: oc-api-proxy-*
          merge-multiple: true
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
